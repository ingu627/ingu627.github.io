<!-- Web fonts: linked here (fetched in parallel with main.css) instead of
     @import-ed from main.css, where they could only be discovered after
     main.css had downloaded - and the same chain was duplicated in
     main_dark.css. Wanted Sans is the primary body font, so it stays
     render-blocking (no swap-induced layout shift); Pretendard is only the
     fallback and must not delay the first paint. -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/wanteddev/wanted-sans@v1.0.1/packages/wanted-sans/fonts/webfonts/variable/split/WantedSansVariable.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"></noscript>

<!-- google ads (deferred: first user interaction, else 5s) -->
<meta name="google-adsense-account" content="ca-pub-6253756472465876">
{% unless page.no_ads %}
<script>
(function () {
  var loaded = false;
  function load() {
    if (loaded) return;
    loaded = true;
    function tag(src, attrs) {
      var s = document.createElement('script');
      s.async = true;
      s.src = src;
      if (attrs) { for (var k in attrs) { s.setAttribute(k, attrs[k]); } }
      document.head.appendChild(s);
    }
    tag('https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6253756472465876', { crossorigin: 'anonymous' });
    tag('https://fundingchoicesmessages.google.com/i/pub-6253756472465876?ers=1');
    (function signalGooglefcPresent() {
      if (!window.frames['googlefcPresent']) {
        if (document.body) {
          var f = document.createElement('iframe');
          f.style = 'width: 0; height: 0; border: none; z-index: -1000; left: -1000px; top: -1000px;';
          f.style.display = 'none';
          f.name = 'googlefcPresent';
          document.body.appendChild(f);
        } else {
          setTimeout(signalGooglefcPresent, 0);
        }
      }
    })();
  }
  ['scroll', 'mousemove', 'touchstart', 'keydown', 'click'].forEach(function (e) {
    window.addEventListener(e, load, { once: true, passive: true });
  });
  setTimeout(load, 5000);
})();
</script>
{% endunless %}
