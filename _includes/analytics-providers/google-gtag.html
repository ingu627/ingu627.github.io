{% if site.analytics.google.tracking_id %}{% unless site.analytics.tag_manager.id and site.analytics.tag_manager.owns_analytics %}
<!-- Direct gtag init is skipped while Google Tag Manager owns analytics
     (_config.yml: analytics.tag_manager.owns_analytics), so a pageview can only
     be counted once. -->
<!-- Global site tag (gtag.js) - Google Analytics.
     Loaded shortly after first paint instead of blocking it: idle (bounded),
     first interaction, or the moment the page is hidden/left - so a visitor who
     bounces in ~1s is still recorded. A 4s idle window used to drop those. -->
<script>
(function () {
  var id = '{{ site.analytics.google.tracking_id }}';
  window.dataLayer = window.dataLayer || [];
  function gtag() { dataLayer.push(arguments); }
  gtag('js', new Date());
  gtag('config', id{% if site.analytics.google.anonymize_ip == true %}, { 'anonymize_ip': true }{% endif %});
{% if page.url == '/404.html' %}
  // Sent from here because only this function pushes a genuine arguments object;
  // gtag.js ignores plain arrays and plain objects pushed to dataLayer directly.
  gtag('event', 'page_not_found', {
    page_location: window.location.href,
    page_path: window.location.pathname
  });
{% endif %}
  var loaded = false;
  function load() {
    if (loaded) return;
    loaded = true;
    var s = document.createElement('script');
    s.async = true;
    s.src = 'https://www.googletagmanager.com/gtag/js?id=' + id;
    document.head.appendChild(s);
  }
  if ('requestIdleCallback' in window) {
    requestIdleCallback(load, { timeout: 1200 });
  } else {
    setTimeout(load, 1200);
  }
  ['scroll', 'mousemove', 'touchstart', 'pointerdown', 'keydown'].forEach(function (e) {
    window.addEventListener(e, load, { once: true, passive: true });
  });
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'hidden') load();
  }, { once: true });
  window.addEventListener('pagehide', load, { once: true });
})();
</script>
{% endunless %}{% endif %}
