      displayMath: [ ['$$','$$'], ["\\[","\\]"] ],
      processEscapes: true,
      skipTags: ["script", "noscript", "style", "textarea", "pre", "code"]

  });

    console.warn("TeX Jax - parse error: " + message[1]);
  });
</script>
